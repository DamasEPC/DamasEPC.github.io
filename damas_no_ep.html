<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Damas no EP</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        sage: {
                            50: '#f4f7f4',
                            100: '#e3eae3',
                            200: '#c7d5c7',
                            300: '#a2b8a2',
                            600: '#557055',
                            700: '#435843',
                            800: '#354635',
                            900: '#2b392b',
                        }
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
    </style>
    <!-- Ligação ao ficheiro externo de textos -->
    <script src="textos.js"></script>
</head>
<body class="bg-sage-50 text-sage-900 min-h-screen flex flex-col justify-between">

    <!-- Cabeçalho Principal -->
    <header class="bg-sage-800 text-white shadow-md py-4 px-6">
        <div class="max-w-7xl mx-auto flex items-center justify-between gap-4">
            <!-- Imagem Esquerda do Título -->
            <div class="flex items-center justify-center w-24 h-16 sm:w-28 sm:h-20 bg-sage-900/40 rounded border border-sage-600 p-1">
                <img src="Imagens para decorar/iniciojogo.jpg" 
                     onerror="this.src='https://placehold.co/100x80/354635/ffffff?text=Inicio+Jogo';" 
                     alt="Início do Jogo" 
                     class="max-h-full max-w-full object-contain rounded">
            </div>

            <!-- Título Maior com Espaços Amplos Apenas Entre Palavras -->
            <h1 class="text-2xl sm:text-4xl md:text-5xl font-extrabold text-center text-sage-100 uppercase tracking-normal">
                Damas &nbsp;&nbsp;&nbsp; no &nbsp;&nbsp;&nbsp; EP
            </h1>

            <!-- Imagem Direita do Título -->
            <div class="flex items-center justify-center w-24 h-16 sm:w-28 sm:h-20 bg-sage-900/40 rounded border border-sage-600 p-1">
                <img src="Imagens para decorar/tab-num.ico" 
                     onerror="this.onerror=null; this.src='Imagens para decorar/tabuleiros.ico';" 
                     alt="Tabuleiro Numerado" 
                     class="max-h-full max-w-full object-contain rounded">
            </div>
        </div>
    </header>

    <!-- Banner com 4 imagens idênticas -->
    <section class="bg-sage-100 border-y border-sage-200 py-2 px-4">
        <div class="max-w-7xl mx-auto grid grid-cols-4 gap-2 sm:gap-4">
            <div class="flex items-center justify-center bg-white border border-sage-200 rounded p-1 h-16 sm:h-20 shadow-sm">
                <img src="Imagens para decorar/tabuleiros.gif" 
                     onerror="this.src='https://placehold.co/150x70/c7d5c7/354635?text=Tabuleiro+1';" 
                     alt="Tabuleiro 1" 
                     class="max-h-full max-w-full object-contain">
            </div>
            <div class="flex items-center justify-center bg-white border border-sage-200 rounded p-1 h-16 sm:h-20 shadow-sm">
                <img src="Imagens para decorar/tabuleiros.gif" 
                     onerror="this.src='https://placehold.co/150x70/c7d5c7/354635?text=Tabuleiro+2';" 
                     alt="Tabuleiro 2" 
                     class="max-h-full max-w-full object-contain">
            </div>
            <div class="flex items-center justify-center bg-white border border-sage-200 rounded p-1 h-16 sm:h-20 shadow-sm">
                <img src="Imagens para decorar/tabuleiros.gif" 
                     onerror="this.src='https://placehold.co/150x70/c7d5c7/354635?text=Tabuleiro+3';" 
                     alt="Tabuleiro 3" 
                     class="max-h-full max-w-full object-contain">
            </div>
            <div class="flex items-center justify-center bg-white border border-sage-200 rounded p-1 h-16 sm:h-20 shadow-sm">
                <img src="Imagens para decorar/tabuleiros.gif" 
                     onerror="this.src='https://placehold.co/150x70/c7d5c7/354635?text=Tabuleiro+4';" 
                     alt="Tabuleiro 4" 
                     class="max-h-full max-w-full object-contain">
            </div>
        </div>
    </section>

    <!-- Área Principal de Conteúdo (Duas Colunas) -->
    <main class="max-w-7xl mx-auto w-full p-4 sm:p-6 flex-grow grid grid-cols-1 md:grid-cols-4 gap-6">
        
        <!-- Coluna da Esquerda: Menu Principal -->
        <div class="md:col-span-1 bg-white rounded-xl shadow-sm border border-sage-200 p-4">
            <h2 class="text-sm font-bold text-sage-800 mb-3 border-b border-sage-200 pb-2 uppercase tracking-wider">
                Menu
            </h2>
            <nav id="menu-container" class="flex flex-col gap-2">
                <!-- Botões do menu gerados via Javascript -->
            </nav>
        </div>

        <!-- Coluna da Direita: Grelha de Botões (3 linhas x 5 colunas) -->
        <div class="md:col-span-3 bg-white rounded-xl shadow-sm border border-sage-200 p-6 flex flex-col justify-between">
            <div>
                <!-- Título da Categoria Selecionada -->
                <div class="border-b border-sage-200 pb-3 mb-6 flex items-center justify-between">
                    <h2 id="content-title" class="text-xl font-bold text-sage-800">
                        Selecione uma opção
                    </h2>
                    <span class="text-xs font-semibold bg-sage-100 text-sage-700 px-2.5 py-1 rounded-full">15 itens</span>
                </div>

                <!-- Grelha com 15 botões (3 linhas x 5 botões) -->
                <div id="items-container" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-5 gap-3">
                    <!-- Botões sem extensão gerados via Javascript -->
                </div>
            </div>

            <!-- Rodapé Simplificado -->
            <div class="mt-8 pt-4 border-t border-sage-100 text-sm font-medium text-sage-600 text-center">
                 Organização de materiais outrora publicados em espaços Lusodama <br>

		Realizada por Carlos Farias - Covilhã

            </div>
        </div>
    </main>

    <!-- Janela Modal / Popup de Visualização -->
    <div id="media-modal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-2xl shadow-2xl max-w-2xl w-full overflow-hidden flex flex-col border border-sage-200">
            <!-- Cabeçalho do Modal -->
            <div class="bg-sage-800 text-white px-6 py-4 flex items-center justify-between">
                <h3 id="modal-title" class="font-semibold text-lg">Visualizador</h3>
                <button onclick="closeModal()" class="text-sage-200 hover:text-white p-1 rounded-lg hover:bg-sage-700 transition-colors" title="Fechar">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                </button>
            </div>

            <!-- Conteúdo do Modal -->
            <div class="p-6 flex flex-col items-center gap-4 bg-sage-50">
                <div id="modal-media-container" class="w-full flex justify-center items-center bg-black/5 rounded-xl overflow-hidden min-h-[220px] max-h-[60vh] border border-sage-200 p-2">
                    <!-- Conteúdo de imagem, vídeo ou PDF -->
                </div>
                <div id="modal-text-box" class="w-full bg-white p-4 rounded-xl shadow-sm border border-sage-200 text-sage-700 text-sm">
                    <!-- Texto personalizado e links -->
                </div>
            </div>

            <!-- Rodapé do Modal -->
            <div class="bg-white px-6 py-4 border-t border-sage-200 flex justify-end">
                <button onclick="closeModal()" class="px-5 py-2.5 bg-sage-700 hover:bg-sage-800 text-white text-sm font-medium rounded-xl shadow-sm transition-colors flex items-center gap-2">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Voltar ao Damas no EP
                </button>
            </div>
        </div>
    </div>

    <script>
        // Estrutura das opções do menu (Ficheiros configurado com extensão pdf)
        const menuItems = [
            { name: "Curtas", folder: "Curtas", prefix: "curta", ext: "jpg", type: "image" },
            { name: "Fichas", folder: "Fichas", prefix: "ficha", ext: "jpg", type: "image" },
            { name: "Filmes", folder: "Filmes", prefix: "filme", ext: "avi", type: "video" },
            { name: "Finais", folder: "Finais", prefix: "final", ext: "jpg", type: "image" },
            { name: "Golpes", folder: "Golpes", prefix: "golpe", ext: "jpg", type: "image" },
            { name: "Jogos", folder: "Jogos", prefix: "jogo", ext: "jpg", type: "image" },
            { name: "Problemas", folder: "Problemas", prefix: "problema", ext: "jpg", type: "image" },
            { name: "Ficheiros", folder: "Ficheiros", prefix: "ficheiro", ext: "pdf", type: "pdf" }
        ];

        window.onload = function() {
            renderMenu();
            selectCategory(menuItems[0].name);
        };

        // Renderiza os botões do menu
        function renderMenu() {
            const menuContainer = document.getElementById('menu-container');
            menuContainer.innerHTML = '';

            menuItems.forEach(item => {
                const btn = document.createElement('button');
                btn.id = `menu-btn-${item.name}`;
                btn.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium text-sm transition-all text-sage-800 hover:bg-sage-100 border border-transparent";
                
                btn.innerHTML = `
                    <img src="Imagens para decorar/tab-num.ico" 
                         onerror="this.onerror=null; this.src='Imagens para decorar/tabuleiros.ico';" 
                         alt="" 
                         class="w-5 h-5 object-contain flex-shrink-0">
                    <span>${item.name}</span>
                `;
                
                btn.onclick = () => selectCategory(item.name);
                menuContainer.appendChild(btn);
            });
        }

        // Seleciona uma categoria e constrói a grelha de 15 botões (3x5)
        function selectCategory(categoryName) {
            menuItems.forEach(item => {
                const b = document.getElementById(`menu-btn-${item.name}`);
                if (b) {
                    if (item.name === categoryName) {
                        b.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg font-bold text-sm bg-sage-700 text-white shadow-sm";
                    } else {
                        b.className = "w-full flex items-center gap-3 px-3 py-2.5 rounded-lg font-medium text-sm text-sage-800 hover:bg-sage-100 border border-transparent";
                    }
                }
            });

            const category = menuItems.find(i => i.name === categoryName);
            if (!category) return;

            document.getElementById('content-title').innerText = category.name;

            const itemsContainer = document.getElementById('items-container');
            itemsContainer.innerHTML = '';

            for (let i = 1; i <= 15; i++) {
                const numStr = i < 10 ? `0${i}` : `${i}`;
                
                const labelName = `${category.prefix}${numStr}`;
                const fileName = `${category.prefix}${numStr}.${category.ext}`;
                const filePath = `${category.folder}/${fileName}`;

                const btn = document.createElement('button');
                btn.className = "w-full py-3.5 px-2 bg-sage-100 hover:bg-sage-700 hover:text-white border border-sage-200 rounded-lg text-xs font-semibold text-sage-800 transition-colors shadow-sm text-center truncate";
                btn.innerText = labelName;
                btn.title = labelName;
                btn.onclick = () => openMediaModal(category, labelName, fileName, filePath);

                itemsContainer.appendChild(btn);
            }
        }

        // Abre a janela modal com o conteúdo adequado e o texto personalizado
        function openMediaModal(category, labelName, fileName, filePath) {
            const modal = document.getElementById('media-modal');
            const modalTitle = document.getElementById('modal-title');
            const mediaContainer = document.getElementById('modal-media-container');
            const textBox = document.getElementById('modal-text-box');

            modalTitle.innerText = labelName;
            
            if (category.type === 'video') {
                mediaContainer.innerHTML = `
                    <div class="flex flex-col items-center justify-center py-6 px-4 text-center bg-sage-900 text-white rounded-lg w-full">
                        <svg class="w-12 h-12 text-sage-300 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
                        <p class="font-semibold text-sm mb-2">${fileName}</p>
                        <video controls class="w-full max-h-56 rounded bg-black">
                            <source src="${filePath}" type="video/avi">
                            <source src="${filePath}" type="video/mp4">
                            O seu navegador não suporta a reprodução direta deste formato.
                        </video>
                    </div>
                `;
            } else if (category.type === 'pdf') {
                mediaContainer.innerHTML = `
                    <div class="w-full flex flex-col items-center justify-center py-8 bg-white rounded-lg border border-sage-200">
                        <svg class="w-16 h-16 text-red-500 mb-2" fill="currentColor" viewBox="0 0 24 24"><path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/></svg>
                        <p class="font-semibold text-sage-800 mb-3">${fileName}</p>
                        <a href="${filePath}" target="_blank" class="px-4 py-2 bg-sage-700 hover:bg-sage-800 text-white text-xs font-medium rounded-lg shadow-sm transition-colors">
                            Abrir Documento PDF
                        </a>
                    </div>
                `;
            } else {
                mediaContainer.innerHTML = `
                    <img src="${filePath}" 
                         onerror="this.src='https://placehold.co/400x300/e3eae3/354635?text=${labelName}';" 
                         alt="${labelName}" 
                         class="max-h-[50vh] max-w-full object-contain rounded shadow">
                `;
            }

            // Lê do ficheiro externo 'textos.js' (variável fileDescriptions)
            const customText = (typeof fileDescriptions !== 'undefined' && fileDescriptions[category.name] && fileDescriptions[category.name][labelName]) 
                ? fileDescriptions[category.name][labelName] 
                : `Informação detalhada referente ao item ${labelName}.`;

            let footerExtra = '';
            if (category.name === "Ficheiros") {
                const docPath = `${category.folder}/${labelName}.doc`;
                footerExtra = `
                    <div class="mt-3 pt-2 border-t border-sage-100 flex items-center justify-between">
                        <span class="text-xs text-sage-600">Versão editável:</span>
                        <a href="${docPath}" class="text-xs font-semibold text-sage-700 hover:text-sage-900 underline flex items-center gap-1" download>
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                            Baixar / Abrir ${labelName}.doc
                        </a>
                    </div>
                `;
            }

            textBox.innerHTML = `
                <p class="text-sage-800 leading-relaxed">${customText}</p>
                ${footerExtra}
            `;

            modal.classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('media-modal').classList.add('hidden');
        }

        window.onkeydown = function(event) {
            if (event.key === "Escape") {
                closeModal();
            }
        };
    </script>
</body>
</html>
